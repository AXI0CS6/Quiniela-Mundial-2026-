<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla de Posiciones — Quiniela Mundial 2026</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .podium {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .podium-item {
      text-align: center;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      min-width: 140px;
    }
    .podium-item .medal { font-size: 2.8rem; display: block; margin-bottom: 8px; }
    .podium-item .p-name { font-weight: 700; font-size: 1rem; color: var(--green-dark); }
    .podium-item .p-team { font-size: 0.82rem; color: var(--text-light); margin: 4px 0; }
    .podium-item .p-pts { font-size: 1.4rem; font-weight: 700; color: var(--gold-dark); }
    .podium-1 { order: 2; transform: translateY(-20px); }
    .podium-2 { order: 1; }
    .podium-3 { order: 3; }
  </style>
</head>
<body>
  <header>
    <h1>🏆 <span>Tabla</span> de Posiciones</h1>
    <nav>
      <a href="/">Inicio</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>

  <div class="container">

    <div class="hero">
      <div class="hero-emoji">🏆</div>
      <div>
        <h2>Tabla de Posiciones</h2>
        <p>Mundial FIFA 2026 · Actualizada en tiempo real</p>
      </div>
      <div style="margin-left:auto">
        <button class="btn btn-gold" onclick="loadAll()">🔄 Actualizar</button>
      </div>
    </div>

    <!-- Podium -->
    <div id="podium" class="podium"></div>

    <!-- Full table -->
    <div class="card">
      <h2>📋 Clasificación Completa</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Participante</th>
              <th>Equipo Favorito</th>
              <th>Grupo</th>
              <th>Puntos</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Recent matches -->
    <div class="card">
      <h2>⚽ Últimos Resultados</h2>
      <div id="recent-matches"></div>
    </div>

  </div>

  <footer style="text-align:center;padding:20px;color:var(--text-light);font-size:0.8rem;">
    Ejercicio educativo · Vibe Coding con Windsurf + Cascade · KT_MxDC
  </footer>

  <script src="/utils.js"></script>
  <script>
    async function loadAll() {
      await Promise.all([loadLeaderboard(), loadMatches()]);
    }

    async function loadLeaderboard() {
      try {
        const board = await api('GET', '/api/public/leaderboard');
        renderPodium(board);
        renderTable(board);
      } catch(e) { toast('Error cargando tabla: ' + e.message, 'error'); }
    }

    function renderPodium(board) {
      const top3 = board.slice(0, 3);
      const medals = ['🥇', '🥈', '🥉'];
      const classes = ['podium-1', 'podium-2', 'podium-3'];
      const podiumEl = document.getElementById('podium');

      if (!top3.length) { podiumEl.innerHTML = '<p style="color:var(--text-light)">Sin datos aún.</p>'; return; }

      podiumEl.innerHTML = top3.map((p, i) => `
        <div class="podium-item ${classes[i]}">
          <span class="medal">${medals[i]}</span>
          <div class="p-name">${p.name}</div>
          <div class="p-team">${p.team_flag || ''} ${p.team_name || '—'}</div>
          <div class="p-pts">${p.points} pts</div>
        </div>
      `).join('');
    }

    function renderTable(board) {
      const tbody = document.getElementById('leaderboard-tbody');
      if (!board.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-light);padding:24px;">Sin participantes registrados.</td></tr>';
        return;
      }
      tbody.innerHTML = board.map((r, i) => `
        <tr class="${i < 3 ? 'rank-' + (i+1) : ''}">
          <td style="font-size:1.1rem">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</td>
          <td><strong>${r.name}</strong></td>
          <td>${r.team_flag || ''} ${r.team_name || '—'}</td>
          <td>${r.team_group ? `<span class="badge-group">${r.team_group}</span>` : '—'}</td>
          <td><strong style="font-size:1.1rem;">${r.points}</strong> <span style="color:var(--text-light);font-size:0.82rem">pts</span></td>
        </tr>
      `).join('');
    }

    async function loadMatches() {
      try {
        const matches = await api('GET', '/api/public/matches');
        const finished = matches.filter(m => m.status === 'FINISHED' && m.home_score !== null).slice(-8).reverse();
        const recent = document.getElementById('recent-matches');
        if (!finished.length) {
          recent.innerHTML = '<p style="color:var(--text-light)">Sin resultados disponibles aún.</p>';
          return;
        }
        recent.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th>Local</th><th>Resultado</th><th>Visitante</th><th>Fecha</th></tr></thead>
          <tbody>` +
          finished.map(m => `<tr>
            <td style="text-align:right;font-weight:600">${m.home_team}</td>
            <td style="text-align:center"><strong>${m.home_score} – ${m.away_score}</strong></td>
            <td style="font-weight:600">${m.away_team}</td>
            <td style="font-size:0.8rem;color:var(--text-light)">${fmtDate(m.match_date)}</td>
          </tr>`).join('') +
          `</tbody></table></div>`;
      } catch(e) {}
    }

    loadAll();
    // Auto-refresh every 60 seconds
    setInterval(loadAll, 60000);
  </script>
</body>
</html>
